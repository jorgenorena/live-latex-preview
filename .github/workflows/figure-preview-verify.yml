name: Temporary figure-preview verification

on:
  push:
    branches:
      - feature/figure-preview

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs and TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox texlive-latex-base dvisvgm

      - name: Tangle and show generated diff
        run: |
          sh ./literate tangle
          git diff -- live-tex-preview.el live-tex-preview-tex.el test/live-tex-preview-test.el
          git diff --exit-code -- live-tex-preview.el live-tex-preview-tex.el test/live-tex-preview-test.el
