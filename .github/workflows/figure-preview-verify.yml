name: Temporary figure-preview verification

on:
  push:
    branches:
      - feature/figure-preview

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs and TeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox texlive-latex-base dvisvgm

      - name: Check literate source and tests
        run: sh ./literate check

      - name: Byte compile core TeX frontend
        run: |
          emacs -Q --batch -L . -f batch-byte-compile \
            live-tex-preview-engine.el live-tex-preview.el live-tex-preview-tex.el

      - name: Smoke-test PDF to SVG conversion
        run: |
          mkdir -p /tmp/live-tex-pdf-smoke
          cat >/tmp/live-tex-pdf-smoke/test.tex <<'EOF'
          \\documentclass{article}
          \\begin{document}
          figure preview smoke test
          \\end{document}
          EOF
          cd /tmp/live-tex-pdf-smoke
          pdflatex -interaction=batchmode -halt-on-error test.tex
          dvisvgm --pdf --page=1 --bbox=min --verbosity=0 \
            --output=/tmp/live-tex-pdf-smoke/test.svg test.pdf
          test -s /tmp/live-tex-pdf-smoke/test.svg
